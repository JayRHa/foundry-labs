name: Test examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  intune-change-briefing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/intune-change-briefing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/intune-change-briefing/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile review_change.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate example without Azure access
        run: python review_change.py change.example.json --dry-run

  realtime-voice-screen-share:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/realtime-voice-screen-share

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/realtime-voice-screen-share/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile service
        run: python -m py_compile app.py

      - name: Run unit tests
        run: pytest -q
